# Render Blueprint — deploys the VoiceForge backend.
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and creates the service below automatically. (You can also skip this file
# and create the Web Service by hand in the dashboard — see README.md.)
#
# IMPORTANT: "standard" (2 GB RAM) is the minimum plan that can actually
# load the XTTS v2 model + PyTorch. The free and starter plans only give
# 512 MB RAM and will crash on startup. See README.md for current pricing.

services:
  - type: web
    name: voiceforge-backend
    runtime: python
    plan: standard
    region: oregon          # pick the region closest to your users
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    # Optional: without a persistent disk, every redeploy or restart wipes
    # cloned voices and generated clips (Render's filesystem is ephemeral
    # otherwise). Uncomment this to keep them across restarts — it adds to
    # the monthly cost. See README.md's "Persistence on Render" section.
    # disk:
    #   name: voiceforge-storage
    #   mountPath: /opt/render/project/src/backend/storage
    #   sizeGB: 1
